<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2a2e"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>VisLevel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b2a2e;--card:#103c42;--card2:#164b52;--ink:#eaf6f4;--mute:#8fb8b6;--acc:#f2b84b;--ok:#5fd1b0;--bad:#ff8f7a;--r:18px}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top)}
#app{max-width:520px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:2rem;font-weight:800}h2{font-size:1.25rem;font-weight:800;margin:20px 0 10px}
.mute{color:var(--mute)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(160deg,var(--card2),var(--card));padding:20px}
.big{font-size:3rem;font-weight:800;line-height:1;color:var(--acc)}
.bar{height:14px;background:#0b2a2e;border-radius:99px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .6s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .card{margin:0}.grid b{font-size:1.5rem;display:block}
label{display:block;margin:14px 0 6px;color:var(--mute);font-size:.95rem}
input{width:100%;font:inherit;font-size:1.1rem;padding:14px;border-radius:14px;border:2px solid transparent;background:#0b2a2e;color:var(--ink)}
input:focus{outline:none;border-color:var(--acc)}
button{font:inherit;font-weight:800;font-size:1.1rem;border:0;border-radius:14px;padding:16px;width:100%;background:var(--acc);color:#2a1d00;margin-top:16px;cursor:pointer}
button.ghost{background:transparent;color:var(--mute);border:2px solid var(--card2)}
button.small{width:auto;padding:6px 10px;font-size:.85rem;margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.xp{color:var(--acc);font-weight:800}
.err{color:var(--bad);margin-top:10px;min-height:1.2em}
.preview{background:#0b2a2e;border-radius:14px;padding:14px;margin-top:18px}
.preview .t{font-size:1.6rem;font-weight:800;color:var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--card2)}
nav div{display:flex;width:100%;max-width:520px}
nav a{flex:1;text-align:center;padding:12px 4px;color:var(--mute);font-size:.8rem;cursor:pointer}
nav a span{display:block;font-size:1.5rem}
nav a.on{color:var(--acc)}
.login{padding-top:12vh}
.rank{font-size:1.6rem;width:36px}
.hidden{display:none}.tt{display:inline-block;background:var(--card2);border-radius:99px;padding:4px 10px;margin:0 6px 6px 0;font-size:.85rem}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal .day{background:var(--card);border-radius:10px;padding:8px 0;min-height:48px;cursor:pointer}.cal .day.has{background:var(--card2)}.cal .day.sel{outline:2px solid var(--acc)}.day small{display:block;font-size:.65rem;color:var(--acc)}.chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0}.chip{flex:none;padding:10px 16px;border-radius:99px;background:var(--card);color:var(--mute);font-weight:800;cursor:pointer;white-space:nowrap}.chip.on{background:var(--acc);color:#2a1d00}
.wrap{position:fixed;inset:0;z-index:50;color:#fff;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px calc(env(safe-area-inset-bottom,0px) + 20px)}
.wp{display:flex;gap:4px;margin-right:56px}.wp i{flex:1;height:4px;border-radius:9px;background:rgba(255,255,255,.3)}.wp i.on{background:#fff}
.wx{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 8px);width:auto;margin:0;padding:6px 12px;background:rgba(0,0,0,.25);color:#fff;font-size:1rem}
.ws{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:520px;margin:0 auto;width:100%;animation:up .5s}
.ws .k{opacity:.8;font-size:1.1rem}.ws .h{font-size:2.2rem;font-weight:800;line-height:1.1;margin:8px 0}.ws .n{font-size:6rem;font-weight:800;line-height:1;color:var(--acc)}.ws p{opacity:.85;font-size:1.1rem}.ws .list{margin-top:18px;background:rgba(0,0,0,.2);border-radius:16px;padding:10px 16px}.ws .list .row{padding:6px 0}
@keyframes up{from{opacity:0;transform:translateY(16px)}}.badges{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.bd{background:var(--card);border-radius:14px;padding:10px 2px;text-align:center;font-size:1.6rem;cursor:pointer}.bd small{display:block;font-size:.62rem;color:var(--mute);line-height:1.15;margin-top:4px}.bd.lock{opacity:.35;filter:grayscale(1)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" class="hidden"><div>
<a data-v="home"><span>🏠</span>Home</a><a data-v="add"><span>🎣</span>Vangst</a>
<a data-v="list"><span>🐟</span>Mijn vangsten</a><a data-v="rank"><span>🏆</span>Ranglijst</a><a data-v="me"><span>👤</span>Profiel</a>
</div></nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== STAP 5: plak hier jouw Firebase-gegevens ====== */
const firebaseConfig = {
  apiKey: "AIzaSyBRBrVE4WXYiaZzJ0cGJTVWs31OuSR7jo8",
  authDomain: "vis-level.firebaseapp.com",
  projectId: "vis-level",
  appId: "1:437730865914:web:9ab4026f2a8a9754e40f43"
};
/* ====================================================== */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getFirestore(app);

const FISH = {Voorntje:[10,1],Rietvoorn:[15,1],Kolblei:[15,1],Bliek:[20,1],Brasem:[30,1],Giebel:[30,1],Baars:[40,1],Zeelt:[50,2],Winde:[50,2],Kroeskarper:[50,2],Paling:[75,2],Karper:[75,2],Schubkarper:[75,2],Snoek:[100,2],Spiegelkarper:[100,2],Roofblei:[100,3],Graskarper:[125,3],Snoekbaars:[125,3],Meerval:[250,3],Rivierkreeft:[25,1],Pos:[10,1],Bittervoorn:[10,1],"Zwarte grondel":[10,1],Serpeling:[15,1],Kopvoorn:[30,1],Barbeel:[60,2],Forel:[75,2],Regenboogforel:[75,2],Steur:[250,3]};
const LEVELS = [[0,"Beginner"],[100,"Starter"],[250,"Visser"],[500,"Gevorderd"],[1000,"Ervaren"],[1750,"Specialist"],[2750,"Pro Visser"],[4000,"Expert"],[5500,"Meester Visser"],[7500,"Legende"],[10000,"Visbaas"],[15000,"Visgod"]];

const calc = (soort, cm, kg) => {
  const f = FISH[soort]; if (!f) return null;
  const l = Math.round(cm * f[1]), w = Math.round(kg * 10);
  return { basis: f[0], lengte: l, gewicht: w, totaal: f[0] + l + w };
};
const level = xp => {
  let i = 0; LEVELS.forEach((l, n) => { if (xp >= l[0]) i = n; });
  const next = LEVELS[i + 1];
  return { nr: i + 1, naam: LEVELS[i][1], from: LEVELS[i][0], next: next ? next[0] : null };
};
const num = s => parseFloat(String(s).replace(",", "."));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => Number(n).toLocaleString("nl-NL");
const today = () => new Date().toISOString().slice(0, 10);
const nlDate = d => d.split("-").reverse().join("-");
const BONUS = 50;
const curYear = String(new Date().getFullYear());
let lv = curYear, rv = curYear, goals = {}, lvMode = "lijst", cal = { y: +curYear, m: new Date().getMonth(), d: null };
const isNew = soort => !catches.some(c => c.userId === user.uid && c.soort === soort);

let user = null, catches = [], view = "home", unsub = null, usersMap = {};

/* ---------- Auth ---------- */
onAuthStateChanged(auth, u => {
  user = u;
  if (unsub) { unsub(); unsub = null; }
  if (!u) { $("#nav").classList.add("hidden"); return loginView(); }
  $("#nav").classList.remove("hidden");
  setDoc(doc(db, "users", u.uid), { naam: u.displayName || u.email, email: u.email }, { merge: true }).catch(() => {});
  const u1 = onSnapshot(collection(db, "users"), s => { usersMap = {}; s.forEach(d => usersMap[d.id] = d.data().naam); render(); });
  const u2 = onSnapshot(collection(db, "catches"), s => {
    catches = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.datum.localeCompare(a.datum) || 0);
    render();
  }, e => console.error(e));
  const u3 = onSnapshot(collection(db, "goals"), s => { goals = {}; s.forEach(d => goals[d.id] = d.data().doel); render(); }, () => {});
  unsub = () => { u1(); u2(); u3(); };
});

function loginView(mode = "in") {
  const reg = mode === "reg";
  $("#app").innerHTML = `<div class="login"><h1>🎣 VisLevel</h1><p class="mute">Vang vis, verdien XP, versla je maat.</p>
  ${reg ? `<label>Naam</label><input id="naam" autocomplete="name">` : ""}
  <label>E-mail</label><input id="em" type="email" autocomplete="email">
  <label>Wachtwoord</label><input id="pw" type="password" autocomplete="${reg ? "new-password" : "current-password"}">
  <div class="err" id="err"></div>
  <button id="go">${reg ? "Account maken" : "Inloggen"}</button>
  <button class="ghost" id="sw">${reg ? "Ik heb al een account" : "Account maken"}</button></div>`;
  $("#sw").onclick = () => loginView(reg ? "in" : "reg");
  $("#go").onclick = async () => {
    try {
      const em = $("#em").value.trim(), pw = $("#pw").value;
      if (reg) {
        const naam = $("#naam").value.trim(); if (!naam) throw { code: "naam" };
        const c = await createUserWithEmailAndPassword(auth, em, pw);
        await updateProfile(c.user, { displayName: naam });
        await setDoc(doc(db, "users", c.user.uid), { naam, email: em });
      } else await signInWithEmailAndPassword(auth, em, pw);
    } catch (e) {
      const m = { naam: "Vul je naam in.", "auth/invalid-credential": "E-mail of wachtwoord klopt niet.", "auth/email-already-in-use": "Dit e-mailadres heeft al een account.", "auth/weak-password": "Kies een wachtwoord van minimaal 6 tekens.", "auth/invalid-email": "Dit e-mailadres is ongeldig." };
      $("#err").textContent = m[e.code] || "Inloggen mislukt. Controleer je gegevens en probeer het opnieuw.";
    }
  };
}

/* ---------- Data ---------- */
function stats(list = catches) {
  const by = {};
  list.forEach(c => { (by[c.userId] ||= { id: c.userId, xp: 0, n: 0, soorten: new Set(), maxL: null, maxW: null }); const s = by[c.userId];
    s.xp += c.xp; s.n++; s.soorten.add(c.soort);
    if (!s.maxL || c.lengte > s.maxL.lengte) s.maxL = c;
    if (!s.maxW || c.gewicht > s.maxW.gewicht) s.maxW = c; });
  Object.keys(usersMap).forEach(id => by[id] ||= { id, xp: 0, n: 0, soorten: new Set(), maxL: null, maxW: null });
  return by;
}
const nameOf = id => usersMap[id] || "Visser";

/* ---------- Views ---------- */
function render() {
  if (!user) return;
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.v === view));
  if (view === "add" && $("#fish")) return; // niet het formulier wissen tijdens typen
  ({ home, add: addView, list: listView, rank: rankView, me: meView })[view]();
}
document.querySelectorAll("nav a").forEach(a => a.onclick = () => { view = a.dataset.v; if (view === "add") $("#app").innerHTML = ""; render(); window.scrollTo(0, 0); });

const BADGES = [
  ["🎣", "Eerste vangst", "Sla je eerste vangst op", m => m.n >= 1],
  ["🔟", "10 vangsten", "Sla 10 vangsten op", m => m.n >= 10],
  ["🏅", "50 vangsten", "Sla 50 vangsten op", m => m.n >= 50],
  ["🌈", "5 soorten", "Vang 5 verschillende soorten", m => m.soorten.size >= 5],
  ["🧭", "10 soorten", "Vang 10 verschillende soorten", m => m.soorten.size >= 10],
  ["📏", "Meter-vis", "Vang een vis van 100 cm of meer", m => m.maxL && m.maxL.lengte >= 100],
  ["⚖️", "5 kg+", "Vang een vis van 5 kg of zwaarder", m => m.maxW && m.maxW.gewicht >= 5],
  ["🐊", "10 kg+", "Vang een vis van 10 kg of zwaarder", m => m.maxW && m.maxW.gewicht >= 10],
  ["📅", "5 op 1 dag", "Vang 5 vissen op één dag", m => m.dag >= 5],
  ["🦈", "Roofvisser", "Vang een snoek, baars en snoekbaars", m => ["Snoek", "Baars", "Snoekbaars"].every(x => m.soorten.has(x))]
];

function home() {
  const s = stats()[user.uid] || { xp: 0, n: 0, soorten: new Set() }, L = level(s.xp);
  const pct = L.next ? Math.min(100, (s.xp - L.from) / (L.next - L.from) * 100) : 100;
  const mine = catches.filter(c => c.userId === user.uid), perDag = {};
  mine.forEach(c => perDag[c.datum] = (perDag[c.datum] || 0) + 1);
  const sm = mine.filter(c => c.datum.startsWith(curYear));
  const m = { ...s, dag: Math.max(0, ...Object.values(perDag)) };

  // Duel
  const other = Object.values(stats()).filter(x => x.id !== user.uid).sort((a, b) => b.xp - a.xp)[0];
  let duel = "";
  if (other) {
    const a = s.xp, b = other.xp, d = Math.abs(a - b), pa = a + b ? a / (a + b) * 100 : 50, nm = esc(nameOf(other.id));
    duel = `<h2>Duel</h2><div class="card"><div class="row"><b>${esc(user.displayName || "Jij")}</b><b>${nm}</b></div>
    <div class="bar" style="display:flex"><i style="width:${pa}%"></i><i style="width:${100 - pa}%;background:var(--ok)"></i></div>
    <div class="row"><span class="xp">${fmt(a)} XP</span><span style="color:var(--ok);font-weight:800">${fmt(b)} XP</span></div>
    <div class="mute" style="margin-top:8px">${d === 0 ? "Gelijkspel!" : a > b ? `Jij staat ${fmt(d)} XP voor op ${nm}` : `${nm} staat ${fmt(d)} XP voor`}</div></div>`;
  }

  // Nieuws van de ander sinds je laatste bezoek
  const key = "vl_seen_" + user.uid; let seen = 0;
  try { seen = +localStorage.getItem(key) || 0; if (!seen) localStorage.setItem(key, Date.now()); } catch (e) {}
  const nieuw = seen ? catches.filter(c => c.userId !== user.uid && (c.aangemaakt?.toMillis?.() || 0) > seen).slice(0, 3) : [];
  const banner = nieuw.length ? `<div class="card" style="border:2px solid var(--acc)"><b>Nieuw sinds je laatste bezoek</b>
    ${nieuw.map(c => `<div style="margin-top:6px">🎣 ${esc(nameOf(c.userId))} ving een ${esc(c.soort)} van ${c.lengte} cm</div>`).join("")}
    <button class="small" id="seen" style="margin-top:10px">Oké</button></div>` : "";

  $("#app").innerHTML = `<h1>Hoi ${esc(user.displayName || "visser")} 👋</h1><div style="margin:8px 0 12px">${titlesFor(user.uid).map(t => `<span class="tt">${t}</span>`).join("")}</div>${banner}
  <div class="card hero"><div class="mute">Level ${L.nr} · ${L.naam}</div><div class="big">${fmt(s.xp)} XP</div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  ${L.next ? `<div class="row mute"><span>Level ${L.nr} · ${fmt(L.from)} XP</span><span>Level ${L.nr + 1} · ${fmt(L.next)} XP</span></div>
  <div style="margin-top:8px">Nog <b class="xp">${fmt(L.next - s.xp)} XP</b> te gaan</div>` : `<div class="mute">Hoogste level bereikt</div>`}</div>
  <div class="grid">
  <div class="card"><b>${s.n}</b><span class="mute">Vangsten</span></div>
  <div class="card"><b>${s.soorten.size}</b><span class="mute">Soorten</span></div>
  <div class="card"><b>${s.maxL ? s.maxL.lengte + " cm" : "–"}</b><span class="mute">Grootste vis</span></div>
  <div class="card"><b>${s.maxW ? s.maxW.gewicht + " kg" : "–"}</b><span class="mute">Zwaarste vis</span></div></div>
  <div class="card row" style="margin-top:12px"><span class="mute">Seizoen ${curYear}</span><b>${sm.length} vangsten · <span class="xp">${fmt(sm.reduce((a, c) => a + c.xp, 0))} XP</span></b></div>
  ${cmpLine()}${goalCard()}
  <button id="wr" class="${new Date().getMonth() === 11 ? "" : "ghost"}" style="margin-top:0">✨ Wrapped ${curYear}</button>
  ${duel}
  <h2>Badges ${BADGES.filter(b => b[3](m)).length}/${BADGES.length}</h2>
  <div class="badges">${BADGES.map((b, i) => `<div class="bd ${b[3](m) ? "" : "lock"}" data-i="${i}">${b[0]}<small>${b[1]}</small></div>`).join("")}</div>
  <p class="mute" style="margin-top:10px;font-size:.9rem">Tik op een badge om te zien hoe je hem krijgt.</p>
  ${s.n ? "" : `<p class="mute" style="margin-top:16px">Nog geen vangsten. Tik op Vangst en sla je eerste vis op.</p>`}`;
  document.querySelectorAll(".bd").forEach(el => el.onclick = () => { const b = BADGES[el.dataset.i]; alert(b[1] + (b[3](m) ? " ✅" : " 🔒") + "\n" + b[2]); });
  $("#wr").onclick = () => wrapped(curYear);
  $("#goal").onclick = setGoal;
  if ($("#seen")) $("#seen").onclick = () => { try { localStorage.setItem(key, Date.now()); } catch (e) {} home(); };
}

function addView() {
  $("#app").innerHTML = `<h1>Vangst toevoegen</h1>
  <label>Vissoort</label><input id="fish" list="fl" placeholder="Zoek vissoort..." autocomplete="off">
  <datalist id="fl">${Object.keys(FISH).map(f => `<option value="${f}">`).join("")}</datalist>
  <label>Lengte (cm)</label><input id="cm" inputmode="decimal" placeholder="42">
  <label>Gewicht (kg)</label><input id="kg" inputmode="decimal" placeholder="1,80">
  <label>Water / plek</label><input id="water" placeholder="Amsterdam-Rijnkanaal">
  <label>Datum</label><input id="dat" type="date" value="${today()}">
  <div class="preview" id="pv"><span class="mute">Kies een vissoort en vul lengte en gewicht in.</span></div>
  <div class="err" id="err"></div>
  <button id="save">Vangst opslaan</button>`;
  const upd = () => {
    const r = calc($("#fish").value.trim(), num($("#cm").value) || 0, num($("#kg").value) || 0);
    const nb = r && isNew($("#fish").value.trim()) ? BONUS : 0;
    $("#pv").innerHTML = r ? `<div class="t">${r.totaal + nb} XP</div><div class="row"><span class="mute">Basis</span><span>+${r.basis}</span></div><div class="row"><span class="mute">Lengte</span><span>+${r.lengte}</span></div><div class="row"><span class="mute">Gewicht</span><span>+${r.gewicht}</span></div>${nb ? `<div class="row"><span class="mute">Nieuwe soort 🎉</span><span>+${nb}</span></div>` : ""}` : `<span class="mute">Kies een vissoort uit de lijst.</span>`;
  };
  ["fish", "cm", "kg"].forEach(i => $("#" + i).oninput = upd);
  $("#save").onclick = async () => {
    const soort = $("#fish").value.trim(), cm = num($("#cm").value), kg = num($("#kg").value), water = $("#water").value.trim(), datum = $("#dat").value;
    const r = calc(soort, cm, kg);
    if (!r) return $("#err").textContent = "Kies een vissoort uit de lijst.";
    if (!(cm > 0) || !(kg >= 0) || isNaN(kg)) return $("#err").textContent = "Vul een geldige lengte en gewicht in.";
    if (!datum) return $("#err").textContent = "Kies een datum.";
    $("#save").disabled = true;
    try {
      await addDoc(collection(db, "catches"), { userId: user.uid, soort, lengte: cm, gewicht: kg, xp: r.totaal + (isNew(soort) ? BONUS : 0), bonus: isNew(soort) ? BONUS : 0, water, datum, aangemaakt: serverTimestamp() });
      lv = datum.slice(0, 4); view = "list"; render();
    } catch (e) { $("#err").textContent = "Opslaan mislukt. Controleer je verbinding en probeer het opnieuw."; $("#save").disabled = false; }
  };
}

const bestOf = (l, k) => l.reduce((m, c) => !m || c[k] > m[k] ? c : m, null);
function titlesFor(id) {
  const mine = catches.filter(c => c.userId === id); if (!mine.length) return [];
  const t = [], holds = (re, k) => { const b = bestOf(catches.filter(c => re.test(c.soort)), k); return b && b.userId === id; };
  if (holds(/^Snoek$/, "lengte")) t.push("👑 Snoekenkoning");
  if (holds(/karper/i, "gewicht")) t.push("🏆 Karperkoning");
  if (bestOf(catches, "gewicht").userId === id) t.push("💪 Zware jongen");
  const sp = {}; catches.forEach(c => { const b = sp[c.soort]; if (!b || c.lengte > b.lengte) sp[c.soort] = c; });
  if (Object.values(sp).filter(c => c.userId === id).length >= 3) t.push("🎯 Recordjager");
  if (new Set(mine.map(c => c.soort)).size >= 15) t.push("🧭 Allrounder");
  if (bestOf(mine, "lengte").lengte >= 100) t.push("📏 Meetlat");
  if (!t.length) t.push(mine.length >= 10 ? "🎣 Vaste visser" : "🌱 Nieuwkomer");
  return t;
}
function cmp(y, id = user.uid) {
  const py = String(+y - 1), cut = y === curYear ? new Date().toISOString().slice(5, 10) : "12-31", xp = a => a.reduce((s, c) => s + c.xp, 0);
  const cur = catches.filter(c => c.userId === id && c.datum.startsWith(y)), prev = catches.filter(c => c.userId === id && c.datum.startsWith(py) && c.datum.slice(5) <= cut);
  return prev.length ? { n: cur.length, pn: prev.length, dn: cur.length - prev.length, dx: xp(cur) - xp(prev), py } : null;
}
const cmpLine = () => { const c = cmp(curYear); return c ? `<div class="mute" style="margin:-4px 4px 12px">📈 ${c.dn >= 0 ? "+" : ""}${c.dn} vangsten t.o.v. dezelfde periode in ${c.py} (${c.pn})</div>` : ""; };
function goalCard() {
  const g = goals[curYear], n = catches.filter(c => c.datum.startsWith(curYear)).length;
  if (!g) return `<div class="card row"><span class="mute">Seizoensdoel</span><button class="small" id="goal">Instellen</button></div>`;
  return `<div class="card"><div class="row"><b>Seizoensdoel samen</b><button class="small ghost" id="goal">Wijzig</button></div><div class="bar"><i style="width:${Math.min(100, n / g * 100)}%"></i></div><div class="row"><span>${n} / ${g} vangsten</span><span class="xp">${n >= g ? "🎉 Gehaald!" : `nog ${g - n}`}</span></div></div>`;
}
async function setGoal() {
  const v = parseInt(prompt("Hoeveel vangsten willen jullie dit seizoen samen halen?", goals[curYear] || 100));
  if (v > 0) try { await setDoc(doc(db, "goals", curYear), { doel: v }); } catch (e) { alert("Opslaan mislukt. Staan de nieuwe regels in Firebase?"); }
}
function hallOfFame() {
  const rows = yearsList().map(y => { const yc = catches.filter(c => c.datum.startsWith(y)); if (!yc.length) return "";
    const w = Object.values(stats(yc)).sort((a, b) => b.n - a.n || b.xp - a.xp)[0], bl = bestOf(yc, "lengte"), bw = bestOf(yc, "gewicht");
    return `<div class="card"><div class="row"><b>Seizoen ${y}</b><span class="xp">${y === curYear ? "tussenstand" : "winnaar"}</span></div>
    <div style="font-size:1.3rem;font-weight:800;margin:4px 0">🏆 ${esc(nameOf(w.id))} <span class="mute" style="font-size:.95rem">${w.n} vangsten</span></div>
    <div class="mute">Grootste: ${esc(nameOf(bl.userId))} · ${esc(bl.soort)} ${bl.lengte} cm<br>Zwaarste: ${esc(nameOf(bw.userId))} · ${esc(bw.soort)} ${bw.gewicht} kg</div></div>`; }).join("");
  return `<h2>Eregalerij</h2>${rows || `<p class="mute">Nog geen seizoenen.</p>`}`;
}
function calHtml() {
  const { y, m } = cal, dim = new Date(y, m + 1, 0).getDate(), off = (new Date(y, m, 1).getDay() + 6) % 7, pre = `${y}-${String(m + 1).padStart(2, "0")}`;
  const mine = catches.filter(c => c.userId === user.uid && c.datum.startsWith(pre)), by = {};
  mine.forEach(c => (by[+c.datum.slice(8)] ||= []).push(c));
  let cells = "<div></div>".repeat(off);
  for (let d = 1; d <= dim; d++) { const n = (by[d] || []).length; cells += `<div class="day ${n ? "has" : ""} ${cal.d === d ? "sel" : ""}" data-d="${d}">${d}${n ? `<small>${n}🐟</small>` : ""}</div>`; }
  return `<div class="row" style="margin:12px 0"><button class="small ghost" id="cp">◀</button><b>${MONTHS[m]} ${y}</b><button class="small ghost" id="cn">▶</button></div>
  <div class="cal">${["ma", "di", "wo", "do", "vr", "za", "zo"].map(x => `<div class="mute">${x}</div>`).join("")}${cells}</div>
  <p class="mute" style="margin:10px 0">${mine.length} vangsten · ${new Set(mine.map(c => c.datum)).size} dagen gevist</p>
  ${(by[cal.d] || []).map(c => `<div class="card row"><b>🐟 ${esc(c.soort)}</b><span class="mute">${c.lengte} cm · ${c.gewicht} kg</span></div>`).join("")}`;
}
const yearsList = () => [...new Set([curYear, ...catches.map(c => c.datum.slice(0, 4))])].sort().reverse();
const chips = (cur, a) => yearsList().map(y => `<div class="chip ${cur === y ? "on" : ""}" data-${a}="${y}">Seizoen ${y}</div>`).join("") + `<div class="chip ${cur === "all" ? "on" : ""}" data-${a}="all">Alle tijd</div>`;
const inYear = (c, y) => y === "all" || c.datum.startsWith(y);

function listView() {
  const kal = lvMode === "kal", mine = catches.filter(c => c.userId === user.uid && inYear(c, lv)), sum = mine.reduce((a, c) => a + c.xp, 0);
  $("#app").innerHTML = `<h1>Mijn vangsten</h1><div class="chips"><div class="chip ${kal ? "" : "on"}" data-md="lijst">Lijst</div><div class="chip ${kal ? "on" : ""}" data-md="kal">Kalender</div></div>`
    + (kal ? calHtml() : `<div class="chips">${chips(lv, "lv")}</div><p class="mute" style="margin-bottom:12px">${mine.length} vangsten · ${fmt(sum)} XP</p>` + (mine.length ? mine.map(c => `<div class="card"><div class="row"><b>🐟 ${esc(c.soort)}</b><span class="xp">${c.xp} XP</span></div>
  <div class="mute">${c.lengte} cm · ${c.gewicht} kg${c.bonus ? ` · 🎉 +${c.bonus} nieuwe soort` : ""}</div><div class="row"><span class="mute">${esc(c.water || "")} ${nlDate(c.datum)}</span><button class="ghost small" data-del="${c.id}">Verwijderen</button></div></div>`).join("") : `<p class="mute">Geen vangsten in deze periode.</p>`));
  document.querySelectorAll("[data-md]").forEach(b => b.onclick = () => { lvMode = b.dataset.md; listView(); });
  document.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => { lv = b.dataset.lv; listView(); });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { if (confirm("Deze vangst verwijderen?")) deleteDoc(doc(db, "catches", b.dataset.del)); });
  document.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { cal.d = cal.d === +b.dataset.d ? null : +b.dataset.d; listView(); });
  const mv = n => { cal.m += n; if (cal.m < 0) { cal.m = 11; cal.y--; } if (cal.m > 11) { cal.m = 0; cal.y++; } cal.d = null; listView(); };
  if ($("#cp")) { $("#cp").onclick = () => mv(-1); $("#cn").onclick = () => mv(1); }
}

function rankView() {
  const all = rv === "all", list = catches.filter(c => inYear(c, rv));
  const st = Object.values(stats(list)).sort(all ? (a, b) => b.xp - a.xp : (a, b) => b.n - a.n || b.xp - a.xp), medal = ["🥇", "🥈", "🥉"];
  const rec = (key, unit, label) => { const b = list.reduce((m, c) => !m || c[key] > m[key] ? c : m, null);
    return `<div class="card"><div class="mute">${label}</div>${b ? `<div class="row"><b>${esc(nameOf(b.userId))} · ${esc(b.soort)}</b><span class="xp">${b[key]} ${unit}</span></div>` : "–"}</div>`; };
  $("#app").innerHTML = `<h1>Ranglijst</h1><div class="chips">${chips(rv, "rv")}</div><p class="mute" style="margin-bottom:12px">${all ? "Alle tijd: gesorteerd op XP" : `Seizoen ${rv}: wie de meeste vangsten heeft, wint`}</p>`
    + st.map((s, i) => { const L = level(stats()[s.id]?.xp || 0);
      return `<div class="card row"><div class="row"><span class="rank">${medal[i] || i + 1}</span><div><b>${esc(nameOf(s.id))}</b> <span class="xp" style="font-size:.85rem">${esc(titlesFor(s.id)[0] || "")}</span><div class="mute">${all ? `Level ${L.nr} · ${L.naam}` : `${fmt(s.xp)} XP · ${s.soorten.size} soorten`}</div></div></div><span class="xp">${all ? fmt(s.xp) + " XP" : s.n + " vangsten"}</span></div>`; }).join("")
    + `<h2>Records</h2>` + rec("lengte", "cm", "Grootste vis") + rec("gewicht", "kg", "Zwaarste vis") + rec("xp", "XP", "Meeste XP uit één vangst") + hallOfFame();
  document.querySelectorAll("[data-rv]").forEach(b => b.onclick = () => { rv = b.dataset.rv; rankView(); });
}

const MONTHS = ["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"];
const topBy = (arr, f) => { const m = {}; arr.forEach(x => { const k = f(x); if (k) m[k] = (m[k] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };

function wrapped(y) {
  const yc = catches.filter(c => c.datum.startsWith(y)), mine = yc.filter(c => c.userId === user.uid), sl = [];
  const bg = ["#0b3b3a,#145a52", "#2a1d5e,#5a2f8f", "#5e1d3a,#c2476b", "#0f3a66,#2a7fd1", "#4a3a0a,#d9a21f", "#0b3b2a,#2f9e6d", "#3a1d5e,#0b2a2e", "#0b2a2e,#145a52"];
  if (!mine.length) sl.push(`<div class="k">Seizoen ${y}</div><div class="h">Nog geen vangsten dit seizoen 🎣</div><p>Sla een vangst op, dan bouwt je Wrapped zich vanzelf op.</p>`);
  else {
    const days = new Set(mine.map(c => c.datum)).size, sp = topBy(mine, c => c.soort), mo = topBy(mine, c => c.datum.slice(5, 7)), wa = topBy(mine, c => (c.water || "").trim());
    const xp = mine.reduce((a, c) => a + c.xp, 0), bl = mine.reduce((a, c) => c.lengte > a.lengte ? c : a), bw = mine.reduce((a, c) => c.gewicht > a.gewicht ? c : a);
    const st = Object.values(stats(yc)).sort((a, b) => b.n - a.n || b.xp - a.xp), live = y === curYear, tl = level(stats()[user.uid]?.xp || 0);
    const cp = cmp(y), plek = c => `${nlDate(c.datum)}${c.water ? " · " + esc(c.water) : ""}`;
    sl.push(`<div class="k">Seizoen ${y}</div><div class="h">Jouw jaar op het water, ${esc(user.displayName || "visser")}</div><p>Tik om verder te gaan</p>`,
      `<div class="k">Dit seizoen ving je</div><div class="n">${mine.length}</div><div class="h">vissen</div><p>verdeeld over ${days} ${days === 1 ? "dag" : "dagen"} aan de waterkant</p>`,
      `<div class="k">Je ving</div><div class="n">${sp.length}</div><div class="h">${sp.length === 1 ? "soort" : "verschillende soorten"}</div><div class="list">${sp.slice(0, 5).map(([k, v]) => `<div class="row"><span>${esc(k)}</span><b>${v}×</b></div>`).join("")}</div>`,
      `<div class="k">Je grootste vis</div><div class="n">${bl.lengte} cm</div><div class="h">${esc(bl.soort)}</div><p>${plek(bl)}</p>`,
      `<div class="k">Je zwaarste vis</div><div class="n">${bw.gewicht} kg</div><div class="h">${esc(bw.soort)}</div><p>${plek(bw)}</p>`,
      `<div class="k">Jouw favorieten</div><div class="h">${esc(sp[0][0])}</div><p>je meest gevangen soort (${sp[0][1]}×)</p><div class="h" style="font-size:1.7rem;margin-top:22px">${MONTHS[+mo[0][0] - 1]}</div><p>je beste maand (${mo[0][1]} vangsten)</p>${wa.length ? `<div class="h" style="font-size:1.7rem;margin-top:22px">${esc(wa[0][0])}</div><p>je favoriete plek</p>` : ""}`,
      `<div class="k">Je verdiende</div><div class="n">${fmt(xp)}</div><div class="h">XP dit seizoen</div><p>Je level is nu ${tl.nr} · ${tl.naam}</p>`,
      ...(cp ? [`<div class="k">Vergeleken met ${cp.py}</div><div class="n">${cp.dn >= 0 ? "+" : ""}${cp.dn}</div><div class="h">vangsten</div><p>${cp.n} nu, ${cp.pn} toen · ${cp.dx >= 0 ? "+" : ""}${fmt(cp.dx)} XP</p>`] : []),
      `<div class="k">${live ? "Tussenstand" : "Seizoenswinnaar"}</div><div class="h">${esc(nameOf(st[0].id))} 🏆</div><p>${st[0].id === user.uid ? (live ? "Jij staat bovenaan!" : "Dat ben jij! 🎉") : "met de meeste vangsten"}</p><div class="list">${st.map((x, i) => `<div class="row"><span>${i + 1}. ${esc(nameOf(x.id))}</span><b>${x.n} vangsten</b></div>`).join("")}</div>`,
      `<div class="h">${live ? "Het seizoen loopt nog 🎣" : "Tot volgend seizoen 🎣"}</div><p>Een nieuw seizoen begint op 1 januari. Je level en je totalen blijven bewaard.</p>`);
  }
  let i = 0; const el = document.createElement("div"); el.className = "wrap"; document.body.appendChild(el);
  const draw = () => { el.style.background = `linear-gradient(160deg,${bg[i % bg.length]})`;
    el.innerHTML = `<div class="wp">${sl.map((_, k) => `<i class="${k <= i ? "on" : ""}"></i>`).join("")}</div><button class="wx" aria-label="Sluiten">✕</button><div class="ws">${sl[i]}</div>`;
    el.querySelector(".wx").onclick = e => { e.stopPropagation(); el.remove(); }; };
  el.onclick = e => { if (e.clientX < innerWidth / 3) i = Math.max(0, i - 1); else if (i < sl.length - 1) i++; else return el.remove(); draw(); };
  draw();
}

function meView() {
  const bySp = {}; catches.forEach(c => { const o = bySp[c.soort] ||= { l: null, w: null, ml: null, mw: null }; if (!o.l || c.lengte > o.l.lengte) o.l = c; if (!o.w || c.gewicht > o.w.gewicht) o.w = c;
    if (c.userId === user.uid) { if (!o.ml || c.lengte > o.ml.lengte) o.ml = c; if (!o.mw || c.gewicht > o.mw.gewicht) o.mw = c; } });
  const rec = Object.entries(bySp).filter(([, o]) => o.ml).sort((a, b) => a[0].localeCompare(b[0]));
  $("#app").innerHTML = `<h1>Profiel</h1><div class="card"><b>${esc(user.displayName || "")}</b><div class="mute">${esc(user.email)}</div><div style="margin-top:10px">${titlesFor(user.uid).map(t => `<span class="tt">${t}</span>`).join("")}</div></div>
  <h2>Mijn records per soort</h2>${rec.length ? rec.map(([k, o]) => `<div class="card"><div class="row"><b>${esc(k)}</b><span class="xp">${o.ml.lengte} cm · ${o.mw.gewicht} kg</span></div>
  <div class="mute">${o.l.userId === user.uid ? "👑 Jij hebt het lengterecord" : `Lengterecord: ${esc(nameOf(o.l.userId))} ${o.l.lengte} cm`}<br>${o.w.userId === user.uid ? "👑 Jij hebt het gewichtsrecord" : `Gewichtsrecord: ${esc(nameOf(o.w.userId))} ${o.w.gewicht} kg`}</div></div>`).join("") : `<p class="mute">Nog geen vangsten.</p>`}
  <h2>Wrapped</h2>${yearsList().map(y => `<button class="ghost" data-wr="${y}" style="margin-top:8px">✨ Wrapped ${y}</button>`).join("")}
  <button class="ghost" id="out" style="margin-top:28px">Uitloggen</button>`;
  document.querySelectorAll("[data-wr]").forEach(b => b.onclick = () => wrapped(b.dataset.wr));
  $("#out").onclick = () => signOut(auth);
}
</script>
